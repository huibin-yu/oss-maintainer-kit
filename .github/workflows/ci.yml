name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.21"
      - run: go test ./...
      - run: go build ./cmd/oss-maintainer-kit
      - run: go run ./cmd/oss-maintainer-kit review-diff --diff examples/pr.diff --format sarif > oss-maintainer-kit.sarif
