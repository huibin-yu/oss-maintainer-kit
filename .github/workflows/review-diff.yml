name: review-diff

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Generate pull request diff
        run: git diff origin/${{ github.base_ref }}...HEAD > pr.diff
      - name: Build SARIF report
        run: go run ./cmd/oss-maintainer-kit review-diff --diff pr.diff --config examples/review-rules.json --format sarif > oss-maintainer-kit.sarif
      - name: Build markdown comment
        run: go run ./cmd/oss-maintainer-kit review-diff --diff pr.diff --config examples/review-rules.json --format comment > review-comment.md
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: oss-maintainer-kit.sarif
